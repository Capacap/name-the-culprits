<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Loose Threads</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Libre+Caslon+Text:ital,wght@0,400;0,700;1,400&family=Cinzel:wght@500;700&display=swap">
<link rel="stylesheet" href="play.css">
</head>
<body>
<main>
  <h1>The Loose Threads</h1>
  <p class="lede">A murder mystery in a house of guests. Hear them out, then name the culprits.</p>
  <button id="next" class="random"></button>
  <p id="nextline" class="left"></p>
  <div class="more">
    <button id="random-short">Random short</button>
    <button id="random-long">Random long</button>
  </div>
  <p id="tally" class="left"></p>
  <p class="alpha">Alpha. Your progress is kept in this browser only.</p>
  <h2>All stories</h2>
  <div id="tabs" class="filters"></div>
  <p id="left" class="left"></p>
  <ol id="stories" class="stories"></ol>
</main>
<script type="module" src="play.js"></script>
</body>
</html>
